name: Rule search
# Searches pick rules on the lab's held-out predictions: choose on early
# seasons, confirm on later ones (tools/rule_search.py).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Player model lab run id"
        default: "42841592010"
  push:
    branches: [claude/project-thread-uwy0nd]
    paths: [tools/rule_search.py, .github/workflows/rule_search.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: lab
          path: lab
          run-id: ${{ inputs.run_id || '42841592010' }}
          github-token: ${{ github.token }}
      - run: python tools/rule_search.py lab/lab_games.csv | tee -a "$GITHUB_STEP_SUMMARY"
