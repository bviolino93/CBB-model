name: Game breakdown

# Game-by-game breakdown for today's Division I games (tools/breakdown.py):
# line, our projected score, matchup, form, rest, tier. Writes
# breakdown/cbb/<date>.md and .json to the `breakdowns` branch and the
# run summary. The day's picks are made from that sheet.

on:
  schedule:
    - cron: "30 13 * 11,12,1-4 *"
  push:
    branches: [claude/project-thread-gu6vtk]
    paths: [.github/workflows/breakdown.yml, tools/breakdown.py]
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD, ET). Empty = today"
        default: ""

permissions:
  contents: write

concurrency:
  group: breakdown
  cancel-in-progress: false

jobs:
  breakdown:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CBB_FETCH_MINUTES: "90"
      KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore ESPN cache
        uses: actions/cache/restore@v4
        with:
          path: .cache_cbb
          key: espn-cbb-breakdown-${{ github.run_id }}
          restore-keys: |
            espn-cbb-breakdown-
            espn-cbb-tonight-
            espn-cbb-lab-
            espn-cbb-
      - run: pip install -r requirements.txt
      - name: Breakdown
        run: |
          python tools/breakdown.py --date "${{ inputs.date }}" --out breakdown | tee out.txt
          head -c 900000 breakdown/cbb/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save ESPN cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache_cbb
          key: espn-cbb-breakdown-${{ github.run_id }}
      - name: Publish to breakdowns branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin breakdowns >/dev/null; then
            git fetch -q origin breakdowns
            git worktree add -B breakdowns ../bd origin/breakdowns
          else
            git worktree add --orphan -b breakdowns ../bd
          fi
          mkdir -p ../bd/cbb
          cp breakdown/cbb/* ../bd/cbb/
          cd ../bd
          git add cbb
          git diff --cached --quiet && exit 0
          git commit -q -m "College breakdown $(ls cbb | tail -1 | cut -d. -f1)"
          for i in 1 2 3; do
            git push origin breakdowns && break
            git pull -q --rebase origin breakdowns
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakdown
          path: |
            out.txt
            breakdown/
